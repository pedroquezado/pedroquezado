name: Update Profile Stats

on:
  schedule:
    # Executa uma vez por dia às 03:00 UTC
    - cron: "0 3 * * *"

  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            {"username":"${{ github.repository_owner }}","show_icons":"true","include_all_commits":"true","show":"reviews,prs_merged,prs_merged_percentage","hide_border":"true","bg_color":"00000000","title_color":"00E7FF","text_color":"C9D1D9","icon_color":"7C3AED","ring_color":"00E7FF","locale":"pt-br","custom_title":"GITHUB TELEMETRY"}
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            {"username":"${{ github.repository_owner }}","layout":"compact","langs_count":"8","size_weight":"0.5","count_weight":"0.5","hide_border":"true","bg_color":"00000000","title_color":"00E7FF","text_color":"C9D1D9","locale":"pt-br","custom_title":"TECH TELEMETRY"}
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg

          git diff --cached --quiet && exit 0

          git commit -m "chore: update profile telemetry"
          git push

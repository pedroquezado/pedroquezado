<svg
  width="1200"
  height="340"
  viewBox="0 0 1200 340"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340">
      <stop stop-color="#05070D"/>
      <stop offset="0.5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="180" y1="80" x2="1000" y2="250">
      <stop stop-color="#00E7FF"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#00E7FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00E7FF"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="0.8" stop-color="#00E7FF"/>
      <stop offset="1" stop-color="#00E7FF" stop-opacity="0"/>
    </linearGradient>

    <pattern
      id="grid"
      width="30"
      height="30"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 30 0 L 0 0 0 30"
        fill="none"
        stroke="#00E7FF"
        stroke-opacity="0.07"
        stroke-width="1"
      />
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->

  <rect
    width="1200"
    height="340"
    rx="18"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="340"
    rx="18"
    fill="url(#grid)"
  />

  <!-- GLOW AREAS -->

  <ellipse
    cx="190"
    cy="40"
    rx="220"
    ry="100"
    fill="#00E7FF"
    fill-opacity="0.07"
    filter="url(#softGlow)"
  />

  <ellipse
    cx="1020"
    cy="300"
    rx="220"
    ry="100"
    fill="#7C3AED"
    fill-opacity="0.10"
    filter="url(#softGlow)"
  />

  <!-- TOP BORDER -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="338"
    rx="17"
    stroke="url(#cyanPurple)"
    stroke-opacity="0.50"
    stroke-width="2"
  />

  <!-- HUD CORNERS -->

  <path
    d="M30 65V30H65"
    stroke="#00E7FF"
    stroke-width="2"
    stroke-linecap="round"
  />

  <path
    d="M1135 30H1170V65"
    stroke="#7C3AED"
    stroke-width="2"
    stroke-linecap="round"
  />

  <path
    d="M30 275V310H65"
    stroke="#7C3AED"
    stroke-width="2"
    stroke-linecap="round"
  />

  <path
    d="M1135 310H1170V275"
    stroke="#00E7FF"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- STATUS TOP -->

  <circle
    cx="66"
    cy="57"
    r="5"
    fill="#00E7FF"
    filter="url(#glow)"
  />

  <text
    x="81"
    y="62"
    fill="#8B949E"
    font-family="monospace"
    font-size="13"
    letter-spacing="2"
  >
    SYSTEM ONLINE
  </text>

  <text
    x="1050"
    y="62"
    fill="#8B949E"
    font-family="monospace"
    font-size="13"
    letter-spacing="2"
  >
    PQ // 01
  </text>

  <!-- MAIN TITLE -->

  <text
    x="600"
    y="145"
    text-anchor="middle"
    fill="url(#cyanPurple)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="62"
    font-weight="800"
    letter-spacing="8"
    filter="url(#glow)"
  >
    PEDRO QUEZADO
  </text>

  <!-- SUBTITLE -->

  <text
    x="600"
    y="190"
    text-anchor="middle"
    fill="#C9D1D9"
    font-family="monospace"
    font-size="18"
    letter-spacing="5"
  >
    FULL-STACK DEVELOPER // AI // AUTOMATION
  </text>

  <!-- LINE -->

  <rect
    x="180"
    y="218"
    width="840"
    height="1.5"
    fill="url(#lineGradient)"
  />

  <!-- TECH -->

  <text
    x="600"
    y="253"
    text-anchor="middle"
    fill="#8B949E"
    font-family="monospace"
    font-size="13"
    letter-spacing="3"
  >
    REACT • TYPESCRIPT • NODE • PHP • POSTGRESQL • SUPABASE
  </text>

  <!-- STATUS BOXES -->

  <g font-family="monospace" font-size="11">

    <rect
      x="335"
      y="278"
      width="155"
      height="30"
      rx="5"
      fill="#00E7FF"
      fill-opacity="0.06"
      stroke="#00E7FF"
      stroke-opacity="0.40"
    />

    <circle cx="353" cy="293" r="4" fill="#00E7FF"/>

    <text
      x="365"
      y="297"
      fill="#8B949E"
      letter-spacing="1"
    >
      AI ACTIVE
    </text>

    <rect
      x="505"
      y="278"
      width="190"
      height="30"
      rx="5"
      fill="#7C3AED"
      fill-opacity="0.06"
      stroke="#7C3AED"
      stroke-opacity="0.45"
    />

    <circle cx="523" cy="293" r="4" fill="#7C3AED"/>

    <text
      x="535"
      y="297"
      fill="#8B949E"
      letter-spacing="1"
    >
      AUTOMATION ON
    </text>

    <rect
      x="710"
      y="278"
      width="155"
      height="30"
      rx="5"
      fill="#00E7FF"
      fill-opacity="0.06"
      stroke="#00E7FF"
      stroke-opacity="0.40"
    />

    <circle cx="728" cy="293" r="4" fill="#00E7FF"/>

    <text
      x="740"
      y="297"
      fill="#8B949E"
      letter-spacing="1"
    >
      SHIPPING
    </text>

  </g>

  <!-- DECORATIVE DATA -->

  <g
    stroke="#00E7FF"
    stroke-opacity="0.25"
    stroke-width="1"
  >
    <path d="M80 110H160"/>
    <path d="M80 118H135"/>
    <path d="M80 126H150"/>

    <path d="M1040 110H1120"/>
    <path d="M1065 118H1120"/>
    <path d="M1050 126H1120"/>
  </g>

</svg>
